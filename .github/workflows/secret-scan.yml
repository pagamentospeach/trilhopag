name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Roda diariamente às 3am UTC pra pegar segredos commitados depois
    - cron: "0 3 * * *"

# Permissions mínimas
permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history pra escanear commits passados
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configuração default detecta: AWS keys, Stripe, GitHub PAT,
          # Slack tokens, Google API keys, JWT, OpenAI, Anthropic, etc.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # NÃO fixar base/head: em push pra main, "main" e "HEAD" apontam pro
          # MESMO commit → a action aborta com "BASE and HEAD are the same"
          # (falhava em TODO push). Sem base/head, a action auto-detecta o
          # range por evento: push usa before..after, PR usa base..head do PR,
          # schedule/dispatch escaneia o repo inteiro.
          #
          # extra_args = SÓ --only-verified: a própria action já injeta
          # --no-update no comando. Repetir aqui dava "flag 'no-update' cannot
          # be repeated" (erro que ficava escondido atrás do bug do base/head).
          extra_args: --only-verified

  # Static analysis com semgrep — pega padrões de código vulnerável
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: |
          semgrep ci \
            --config=p/security-audit \
            --config=p/nodejs \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --severity=WARNING \
            --metrics=off
        env:
          SEMGREP_APP_TOKEN: ""
        continue-on-error: true
